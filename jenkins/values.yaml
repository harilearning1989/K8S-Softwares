controller:
  admin:
    username: admin
    password: admin123  # change for production

  serviceType: NodePort
  nodePort: 32000

  persistence:
    enabled: true
    existingClaim: jenkins-pvc

  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - blueocean

  JCasC:
    enabled: true
    configScripts:
      basic-config: |
        jenkins:
          systemMessage: "Jenkins on local Kubernetes 🚀"

agent:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

rbac:
  create: true

serviceAccount:
  create: true