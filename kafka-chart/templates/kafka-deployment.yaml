apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: hari-practiced
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - containerPort: {{ .Values.kafka.brokerPort }}
          env:
            - name: KAFKA_CFG_ZOOKEEPER_CONNECT
              value: zookeeper:{{ .Values.zookeeper.clientPort }}
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            - name: KAFKA_CFG_LISTENERS
              value: PLAINTEXT://:{{ .Values.kafka.brokerPort }}
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:{{ .Values.kafka.brokerPort }}
          volumeMounts:
            - mountPath: /bitnami/kafka
              name: kafka-storage
      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-pvc
