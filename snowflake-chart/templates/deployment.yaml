apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowflake-app
  namespace: {{ .Values.namespace }}
  labels:
    app: snowflake-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: snowflake-app
  template:
    metadata:
      labels:
        app: snowflake-app
    spec:
      containers:
        - name: snowflake-client
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SNOWFLAKE_ACCOUNT
              value: {{ .Values.snowflake.account | quote }}
            - name: SNOWFLAKE_WAREHOUSE
              value: {{ .Values.snowflake.warehouse | quote }}
            - name: SNOWFLAKE_DATABASE
              value: {{ .Values.snowflake.database | quote }}
            - name: SNOWFLAKE_SCHEMA
              value: {{ .Values.snowflake.schema | quote }}
            - name: SNOWFLAKE_ROLE
              value: {{ .Values.snowflake.role | quote }}
            - name: SNOWFLAKE_USER
              value: {{ .Values.snowflake.username | quote }}
            - name: SNOWFLAKE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.snowflake.passwordSecretName }}
                  key: password
          ports:
            - containerPort: {{ .Values.service.port }}