apiVersion: v1
kind: Service
metadata:
  name: snowflake-app
  namespace: {{ .Values.namespace }}
  labels:
    app: snowflake-app
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort }}
  selector:
    app: snowflake-app